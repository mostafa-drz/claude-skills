name: release

# Every portable skill is attached to the GitHub Release as <name>.zip — the file
# claude.ai and Claude Desktop take in Settings > Capabilities. Two ways in:
#   - push a tag like v1.2.0
#   - run this workflow from main with a version (Actions > release > Run workflow,
#     or the API), which creates the tag on main's head for you
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Untrusted input stays in env, never inlined into a script. A manual release is
      # only cut from main, and only with a plain semver tag.
      - name: Resolve the tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Run this from main."; exit 1; }
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::'$TAG' is not vX.Y.Z"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      # Pinned to immutable SHAs, as in check.yml: this job holds a write token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Never release a tree that fails the checks
        run: make check
      - run: make dist
      # Re-running for a version that already has a release refreshes its zips instead
      # of failing, so a release drafted on github.com doesn't strand the workflow.
      - name: Publish the release with one zip per skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --generate-notes --target "$GITHUB_SHA"
          fi
