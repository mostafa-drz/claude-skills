name: release

# Push a tag like v1.2.0 and every portable skill is attached to the GitHub Release as
# <name>.zip — the file claude.ai and Claude Desktop take in Settings > Capabilities.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable SHAs, as in check.yml: this job holds a write token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Never release a tree that fails the checks
        run: make check
      - run: make dist
      - name: Publish the release with one zip per skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --verify-tag
