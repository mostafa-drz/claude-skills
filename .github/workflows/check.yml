name: check

# The catalog is generated from each SKILL.md frontmatter, and frontmatter errors
# fail soft in Claude Code — a broken skill keeps answering /name while automatic
# invocation silently stops. This job is where either problem surfaces.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable SHAs: a mutable tag can be repointed after review, and
      # this job runs before any repo check, with network access and a token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Catalog is current and frontmatter parses
        run: make check
