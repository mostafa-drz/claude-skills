<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>Travel brief — trip summary from bookings, calendar, and destination info</title>
  <!-- Suitcase body -->
  <rect x="3" y="8" width="18" height="13" rx="2"/>
  <!-- Suitcase handle (arcs upward from the top edge) -->
  <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
  <!-- Horizontal strap dividing the two compartments -->
  <line x1="3" y1="14" x2="21" y2="14"/>
  <!-- Accent dot — indicates an active/upcoming trip -->
  <circle cx="16.5" cy="11" r="1.5" fill="#ff5722" stroke="none"/>
</svg>
