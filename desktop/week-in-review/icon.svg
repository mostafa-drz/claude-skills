<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>Weekly calendar bars with end-of-week review marker</title>
  <!-- Calendar frame -->
  <rect x="2" y="3" width="20" height="19" rx="1.5"/>
  <!-- Calendar pins -->
  <line x1="7.5" y1="1.5" x2="7.5" y2="5"/>
  <line x1="16.5" y1="1.5" x2="16.5" y2="5"/>
  <!-- Header divider -->
  <line x1="2" y1="7" x2="22" y2="7" stroke-width="0.75"/>
  <!-- Mon activity bar -->
  <rect x="3.5" y="14" width="2.5" height="5" rx="0.4" opacity="0.45"/>
  <!-- Tue activity bar -->
  <rect x="7" y="11" width="2.5" height="8" rx="0.4" opacity="0.45"/>
  <!-- Wed activity bar -->
  <rect x="10.5" y="15" width="2.5" height="4" rx="0.4" opacity="0.45"/>
  <!-- Thu activity bar -->
  <rect x="14" y="12" width="2.5" height="7" rx="0.4" opacity="0.6"/>
  <!-- Fri activity bar (end of week, full opacity) -->
  <rect x="17.5" y="13" width="2.5" height="6" rx="0.4"/>
  <!-- End-of-week review marker: orange dot above Fri bar -->
  <circle cx="18.75" cy="11" r="1.5" fill="#ff5722" stroke="none"/>
</svg>
