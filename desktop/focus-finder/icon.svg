<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>Focus Finder — calendar with a clear open window between meeting blocks</title>
  <!-- Calendar shell -->
  <rect x="2" y="3" width="20" height="18" rx="1.5"/>
  <line x1="2" y1="8" x2="22" y2="8"/>
  <line x1="7" y1="1.5" x2="7" y2="4.5"/>
  <line x1="17" y1="1.5" x2="17" y2="4.5"/>
  <!-- Meeting blocks above the focus window -->
  <rect x="3.5" y="10"  width="6"   height="2" rx="0.4" fill="currentColor" opacity="0.25"/>
  <rect x="11"  y="10"  width="7.5" height="2" rx="0.4" fill="currentColor" opacity="0.25"/>
  <!-- Focus window: y=13–16, intentionally clear -->
  <!-- Meeting blocks below the focus window -->
  <rect x="3.5" y="17"  width="4"   height="2" rx="0.4" fill="currentColor" opacity="0.25"/>
  <rect x="9"   y="17"  width="9.5" height="2" rx="0.4" fill="currentColor" opacity="0.25"/>
  <!-- Blue accent dot marks the open focus window -->
  <circle cx="19.5" cy="14" r="1.8" fill="#0ea5e9" stroke="none"/>
</svg>
