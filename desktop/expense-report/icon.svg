<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>receipt with categorized line items and verified total</title>
  <!-- Receipt body with torn/serrated bottom edge -->
  <path d="M5 2 L19 2 L19 19 L17 17.5 L15 19 L13 17.5 L11 19 L9 17.5 L7 19 L5 17.5 Z"/>
  <!-- Line items inside receipt -->
  <line x1="8" y1="7"  x2="16" y2="7"  stroke-width="0.75" opacity="0.5"/>
  <line x1="8" y1="10" x2="16" y2="10" stroke-width="0.75" opacity="0.5"/>
  <line x1="8" y1="13" x2="13" y2="13" stroke-width="0.75" opacity="0.5"/>
  <!-- Total line — full width, slightly bolder -->
  <line x1="8" y1="15.5" x2="16" y2="15.5"/>
  <!-- Verified / total accent dot (green) -->
  <circle cx="16" cy="7" r="1.5" fill="#16a34a" stroke="none"/>
</svg>
