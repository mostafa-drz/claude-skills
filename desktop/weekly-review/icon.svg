<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>weekly-review — calendar week with per-day review status</title>

  <!-- Calendar outer frame (the weekly planner) -->
  <rect x="2" y="3" width="20" height="18" rx="2"/>

  <!-- Calendar header strip (separates week label from content) -->
  <line x1="2" y1="8" x2="22" y2="8"/>

  <!-- Calendar ring attachments (classic calendar metaphor) -->
  <line x1="8" y1="1" x2="8" y2="5"/>
  <line x1="16" y1="1" x2="16" y2="5"/>

  <!-- Day rows: four work-day content bars at varying lengths -->
  <line x1="5" y1="11"   x2="16" y2="11"   stroke-width="1" opacity="0.5"/>
  <line x1="5" y1="13.5" x2="13" y2="13.5" stroke-width="1" opacity="0.5"/>
  <line x1="5" y1="16"   x2="15" y2="16"   stroke-width="1" opacity="0.5"/>
  <line x1="5" y1="18.5" x2="11" y2="18.5" stroke-width="1" opacity="0.5"/>

  <!-- Review status dots (right column) — green=reviewed, orange=active, yellow=pending -->
  <circle cx="19" cy="11"   r="1.3" fill="#16a34a" stroke="none"/>
  <circle cx="19" cy="13.5" r="1.3" fill="#16a34a" stroke="none"/>
  <circle cx="19" cy="16"   r="1.3" fill="#ff5722" stroke="none"/>
  <circle cx="19" cy="18.5" r="1.3" fill="#f59e0b" stroke="none"/>

  <!-- "This week" marker in the header (blue = current period) -->
  <circle cx="5" cy="5.5" r="1.2" fill="#0ea5e9" stroke="none"/>
</svg>
