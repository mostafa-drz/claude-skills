<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>Weekly review: five-day calendar with backward arc for reflection</title>
  <!-- Five-day week calendar base -->
  <rect x="2.5" y="6" width="19" height="14" rx="2"/>
  <!-- Header divider -->
  <line x1="2.5" y1="11" x2="21.5" y2="11"/>
  <!-- Four column dividers creating five day cells -->
  <line x1="6.3" y1="11" x2="6.3" y2="20"/>
  <line x1="10.1" y1="11" x2="10.1" y2="20"/>
  <line x1="13.9" y1="11" x2="13.9" y2="20"/>
  <line x1="17.7" y1="11" x2="17.7" y2="20"/>
  <!-- Backward arc at top = reflecting on the past week -->
  <path d="M 16 3.5 A 4 3.5 0 0 0 8 3.5"/>
  <polyline points="10,2.2 8,3.5 10,4.8"/>
  <!-- Friday (day 5) accent dot: the moment of review -->
  <circle cx="19.6" cy="15.5" r="1.3" fill="#ff5722" stroke="none"/>
</svg>
