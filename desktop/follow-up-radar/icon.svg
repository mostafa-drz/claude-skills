<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Follow-up radar — sent email awaiting reply</title>
  <!-- Envelope body -->
  <rect x="2" y="9" width="13" height="10" rx="1.5"/>
  <!-- Envelope flap fold -->
  <polyline points="2,9 8.5,14 15,9"/>
  <!-- Radar arc: 3/4 clockwise circle in upper right, sweeping from top around and back to the envelope edge -->
  <path d="M 19 4 A 4 4 0 1 1 15 8"/>
  <!-- Arrowhead: arc returns toward the envelope, indicating "back to you" -->
  <polyline points="16.5,6.5 15,8 16.5,9.5"/>
  <!-- Orange dot at peak of sweep: pending signal detected -->
  <circle cx="22.5" cy="8" r="1.5" fill="#f59e0b" stroke="none"/>
</svg>
