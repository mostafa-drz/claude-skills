<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>follow-up-tracker — outbound threads awaiting reply</title>
  <!-- Outbox tray — threads that left but got no reply back -->
  <rect x="2" y="15" width="20" height="7" rx="1"/>
  <!-- Document lifted out of the tray — the sent message, hanging in the air -->
  <rect x="7" y="3" width="10" height="14" rx="0.75"/>
  <!-- Message content lines — the ask you're waiting on -->
  <line x1="9.5" y1="7" x2="14.5" y2="7" stroke-width="0.75"/>
  <line x1="9.5" y1="10" x2="13" y2="10" stroke-width="0.75"/>
  <line x1="9.5" y1="13" x2="14" y2="13" stroke-width="0.75"/>
  <!-- Amber dot: aging threads (7–13 days with no reply) -->
  <circle cx="5.5" cy="19" r="1.6" fill="#f59e0b" stroke="none"/>
  <!-- Red dot: overdue threads (14+ days with no reply) -->
  <circle cx="10" cy="19" r="1.6" fill="#dc2626" stroke="none"/>
</svg>
