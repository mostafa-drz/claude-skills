<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>Weekly update — calendar week synthesized into shareable report</title>
  <!-- Calendar page body -->
  <rect x="2" y="4" width="20" height="17" rx="2"/>
  <!-- Calendar binding hooks -->
  <line x1="7" y1="2" x2="7" y2="6"/>
  <line x1="17" y1="2" x2="17" y2="6"/>
  <!-- Week strip divider -->
  <line x1="2" y1="9" x2="22" y2="9"/>
  <!-- Five workday ticks in the week strip (Mon–Fri) -->
  <line x1="5.5" y1="6.5" x2="5.5" y2="8.5" stroke-width="0.75"/>
  <line x1="8.5" y1="6.5" x2="8.5" y2="8.5" stroke-width="0.75"/>
  <line x1="11.5" y1="6.5" x2="11.5" y2="8.5" stroke-width="0.75"/>
  <line x1="14.5" y1="6.5" x2="14.5" y2="8.5" stroke-width="0.75"/>
  <line x1="17.5" y1="6.5" x2="17.5" y2="8.5" stroke-width="0.75"/>
  <!-- Three update lines: Done / In Progress / Next -->
  <line x1="5" y1="12.5" x2="16" y2="12.5"/>
  <line x1="5" y1="15.5" x2="18" y2="15.5"/>
  <line x1="5" y1="18.5" x2="13" y2="18.5"/>
  <!-- Send-ready dot (brand orange = output ready to share) -->
  <circle cx="19" cy="18.5" r="2" fill="#ff5722" stroke="none"/>
</svg>
