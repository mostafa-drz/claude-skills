<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>Project context aggregated from multiple sources</title>
  <!-- Back document (Drive) -->
  <rect x="6" y="4" width="13" height="16" rx="1.5" stroke-width="0.75"/>
  <!-- Front document (primary brief) -->
  <rect x="3" y="7" width="13" height="14" rx="1.5"/>
  <!-- Content lines on front document -->
  <line x1="6" y1="11" x2="13" y2="11" stroke-width="0.75"/>
  <line x1="6" y1="14" x2="13" y2="14" stroke-width="0.75"/>
  <line x1="6" y1="17" x2="10" y2="17" stroke-width="0.75"/>
  <!-- Source indicator dots: Drive (#ff5722), Gmail (#dc2626), Calendar (#0ea5e9) -->
  <circle cx="17" cy="17" r="1.5" fill="#ff5722" stroke="none"/>
  <circle cx="20" cy="14" r="1.5" fill="#dc2626" stroke="none"/>
  <circle cx="20" cy="10" r="1.5" fill="#0ea5e9" stroke="none"/>
</svg>
