<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Design doc review — annotated document page</title>
  <!-- Document body with folded top-right corner -->
  <path d="M5 2 L15 2 L19 6 L19 22 L5 22 Z"/>
  <polyline points="15,2 15,6 19,6"/>
  <!-- Text content lines representing the document body -->
  <line x1="7.5" y1="9" x2="16.5" y2="9" opacity="0.45"/>
  <line x1="7.5" y1="13" x2="16.5" y2="13" opacity="0.45"/>
  <line x1="7.5" y1="17" x2="12.5" y2="17" opacity="0.45"/>
  <!-- Left-margin annotation bar: vertical gutter marker like a PR review comment line -->
  <line x1="3" y1="8" x2="3" y2="18" stroke-width="2.5"/>
  <!-- Orange dot: the active review annotation point — something flagged -->
  <circle cx="3" cy="13" r="2.2" fill="#ff5722" stroke="none"/>
</svg>
