<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>Meeting debrief — calendar event with captured decisions and action items</title>
  <!-- calendar frame -->
  <rect x="2" y="4" width="20" height="18" rx="2"/>
  <!-- binding clips (calendar pin tabs above the frame) -->
  <line x1="7" y1="2" x2="7" y2="6"/>
  <line x1="17" y1="2" x2="17" y2="6"/>
  <!-- header/body divider -->
  <line x1="2" y1="9" x2="22" y2="9"/>
  <!-- captured note lines (decisions + action items) -->
  <line x1="6" y1="13" x2="18" y2="13"/>
  <line x1="6" y1="16" x2="18" y2="16"/>
  <line x1="6" y1="19" x2="13" y2="19"/>
  <!-- orange accent dot: debrief in progress / pending capture -->
  <circle cx="18" cy="19" r="1.75" fill="#ff5722" stroke="none"/>
</svg>
