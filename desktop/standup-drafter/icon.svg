<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>Async standup draft — message bubble with yesterday/today/blockers rows</title>
  <!-- Message bubble frame -->
  <rect x="2" y="3" width="17" height="15" rx="2"/>
  <!-- Message tail pointing right -->
  <path d="M 19 9 L 22 7 L 22 12 Z"/>
  <!-- Three content rows representing yesterday / today / blockers -->
  <line x1="7" y1="8" x2="16" y2="8"/>
  <line x1="7" y1="11.5" x2="15" y2="11.5" opacity="0.6"/>
  <line x1="7" y1="15" x2="13" y2="15" opacity="0.35"/>
  <!-- Status dot: yesterday done (green), today in-progress (blue), blockers open circle -->
  <circle cx="4.5" cy="8" r="1.2" fill="#16a34a" stroke="none"/>
  <circle cx="4.5" cy="11.5" r="1.2" fill="#0ea5e9" stroke="none"/>
  <circle cx="4.5" cy="15" r="1.2" stroke="currentColor" stroke-width="1" fill="none"/>
</svg>
