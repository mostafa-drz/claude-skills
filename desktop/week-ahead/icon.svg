<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>Week ahead — weekly planning brief looking forward</title>
  <!-- Calendar shell -->
  <rect x="2" y="4" width="20" height="17" rx="1.5"/>
  <!-- Hanger lines (calendar ring indicators) -->
  <line x1="8" y1="2" x2="8" y2="6"/>
  <line x1="16" y1="2" x2="16" y2="6"/>
  <!-- Header divider -->
  <line x1="2" y1="9" x2="22" y2="9"/>
  <!-- Three column dividers creating four day zones -->
  <line x1="7.5" y1="9" x2="7.5" y2="21" stroke-width="0.75" opacity="0.25"/>
  <line x1="12" y1="9" x2="12" y2="21" stroke-width="0.75" opacity="0.25"/>
  <line x1="16.5" y1="9" x2="16.5" y2="21" stroke-width="0.75" opacity="0.25"/>
  <!-- Today dot (first zone) — brand primary, the day you plan from -->
  <circle cx="4.75" cy="15" r="1.5" fill="#ff5722" stroke="none"/>
  <!-- Mid-week event dots — ghost, events exist but not highlighted -->
  <circle cx="9.75" cy="13.5" r="0.9" fill="currentColor" opacity="0.3" stroke="none"/>
  <circle cx="14.25" cy="16.5" r="0.9" fill="currentColor" opacity="0.3" stroke="none"/>
  <!-- End-of-week notable event — info blue, a future date that matters -->
  <circle cx="19.25" cy="14" r="1.3" fill="#0ea5e9" stroke="none"/>
</svg>
