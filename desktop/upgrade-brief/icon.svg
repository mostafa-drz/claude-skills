<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>upgrade-brief — changelog document with version-bump arrow</title>
  <!-- changelog document body -->
  <rect x="3" y="5" width="12" height="15" rx="1.5"/>
  <!-- changelog entry lines -->
  <line x1="6.5" y1="10" x2="12" y2="10" stroke-width="0.75" opacity="0.55"/>
  <line x1="6.5" y1="13" x2="12" y2="13" stroke-width="0.75" opacity="0.55"/>
  <line x1="6.5" y1="16" x2="10" y2="16" stroke-width="0.75" opacity="0.55"/>
  <!-- version-bump arrow (pointing up = upgrade direction) -->
  <line x1="18" y1="15" x2="18" y2="6"/>
  <polyline points="15.5,8.5 18,6 20.5,8.5"/>
  <!-- breaking-change accent dot on the first changelog entry -->
  <circle cx="5.5" cy="10" r="1.3" fill="#dc2626" stroke="none"/>
</svg>
