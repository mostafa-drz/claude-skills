<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>doc-review — document examined for gaps and issues</title>
  <!-- Magnifying glass lens -->
  <circle cx="10" cy="10" r="7"/>
  <!-- Handle -->
  <line x1="15.5" y1="15.5" x2="21" y2="21"/>
  <!-- Document lines inside the lens -->
  <line x1="6.5" y1="8.5" x2="13.5" y2="8.5"/>
  <line x1="6.5" y1="11.5" x2="12.5" y2="11.5" stroke-width="0.75" opacity="0.5"/>
  <line x1="6.5" y1="14" x2="11" y2="14" stroke-width="0.75" opacity="0.5"/>
  <!-- Flagged issue dot — something found on the first line -->
  <circle cx="13.5" cy="8.5" r="2" fill="#ff5722" stroke="none"/>
</svg>
