<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
  <title>Focus Planner — deep-work block carved from a meeting-packed week</title>
  <!-- Calendar outline -->
  <rect x="3" y="4" width="18" height="17" rx="2"/>
  <!-- Calendar pins -->
  <line x1="8" y1="2" x2="8" y2="5"/>
  <line x1="16" y1="2" x2="16" y2="5"/>
  <!-- Header separator -->
  <line x1="3" y1="8.5" x2="21" y2="8.5"/>
  <!-- Meeting blocks (scattered, left column) -->
  <rect x="4.5" y="10.5" width="4" height="1.8" rx="0.4" fill="currentColor" opacity="0.4" stroke="none"/>
  <rect x="4.5" y="13.2" width="2.5" height="1.8" rx="0.4" fill="currentColor" opacity="0.4" stroke="none"/>
  <rect x="4.5" y="15.9" width="3.5" height="1.8" rx="0.4" fill="currentColor" opacity="0.4" stroke="none"/>
  <!-- Protected focus block (right column) -->
  <rect x="11" y="10" width="8.5" height="8" rx="1"/>
  <rect x="11" y="10" width="8.5" height="8" rx="1" fill="currentColor" opacity="0.08" stroke="none"/>
  <!-- Accent dot: the active, scheduled focus session -->
  <circle cx="15.25" cy="14" r="2" fill="#ff5722" stroke="none"/>
</svg>
