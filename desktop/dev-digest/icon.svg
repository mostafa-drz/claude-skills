<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Dev digest — scanning the technology ecosystem for signals</title>
  <!-- Signal source: the developer scanning the horizon -->
  <circle cx="4" cy="12" r="2" fill="currentColor" stroke="none"/>
  <!-- Three signal arcs radiating outward — tech ecosystems at different distances -->
