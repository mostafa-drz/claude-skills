<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Sprint planner — backlog items bracketed into capacity-bounded scope</title>
  <!-- Five backlog items: top three full-weight (in scope), bottom two faded (out of scope) -->
  <line x1="8" y1="5" x2="21" y2="5"/>
  <line x1="8" y1="9" x2="21" y2="9"/>
  <line x1="8" y1="13" x2="21" y2="13"/>
  <line x1="8" y1="17" x2="19" y2="17" opacity="0.35" stroke-width="1"/>
  <line x1="8" y1="21" x2="16" y2="21" opacity="0.2" stroke-width="1"/>
  <!-- Scope bracket: captures top three items -->
  <path d="M 6 3.5 L 4 3.5 L 4 14.5 L 6 14.5"/>
  <!-- Capacity threshold dot: where the sprint scope ends -->
  <circle cx="4" cy="14.5" r="1.5" fill="#ff5722" stroke="none"/>
</svg>
